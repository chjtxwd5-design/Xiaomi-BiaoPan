# Compose compiler stability configuration
# 优化 Compose 重组频率，减少生成代码体积
#
# 注意：
# - 原文件中的 T3AuthManager$AuthResult / T3AuthManager$NoticeVersion 已随类改名
#   为 SagAuthManager 而失效（被静默忽略），此处已同步更正。
# - UiState 含 List 与可空对象字段，标记 stable 会掩盖应触发的重组，已移除该条。
com.watchface.idtool.WatchfaceParser$WatchfaceInfo: stable
com.watchface.idtool.ImportedFile: stable
com.watchface.idtool.WatchfaceRecord: stable
com.watchface.idtool.ApkDownloader$DownloadState: stable
com.watchface.idtool.PermissionStatus: stable
com.watchface.idtool.SagAuthManager$AuthResult: stable
com.watchface.idtool.SagAuthManager$NoticeVersion: stable
com.watchface.idtool.LogKeyExtractor$ExtractResult: stable
com.watchface.idtool.LogKeyExtractor$TokenInfo: stable
com.watchface.idtool.CloudConfigManager$CloudConfig: stable
